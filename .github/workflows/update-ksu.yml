name: Sync KernelSU Submodule

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch:   # Allows manual triggers

jobs:
  update-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Parent Repo
        uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 2 # Fetch at least 2 commits to check history for amending
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Submodule
        run: |
          cd KernelSU
          git fetch
          git reset --hard origin/master
          cd ..

      - name: Commit and Force Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the submodule change
          git add KernelSU
          
          # 1. Check if there are actually changes to the submodule pointer
          if git diff --cached --quiet; then
            echo "No changes detected. Skipping."
            exit 0
          fi

          # 2. Define the standard commit message
          COMMIT_MSG="chore: sync KernelSU to latest"

          # 3. Logic to prevent bloat:
          # Check if the last commit was also an automated sync
          LAST_COMMIT_MSG=$(git log -1 --pretty=%B)

          if [ "$LAST_COMMIT_MSG" = "$COMMIT_MSG" ]; then
            echo "Last commit was a sync. Amending to prevent bloat..."
            git commit --amend --no-edit
          else
            echo "Last commit was not a sync. Creating new commit..."
            git commit -m "$COMMIT_MSG"
          fi
          
          # 4. Force push is required because we are rewriting history (amending)
          git push origin HEAD:${{ github.ref_name }} --force
